<section class="pergyl-stack" aria-label="Project Pergyl snippets">
  <article class="pergyl-card pergyl-stack">
    <header>
      <h2 class="pergyl-card-title">Card Title</h2>
      <p class="pergyl-card-subtitle">Dense, readable surface content.</p>
    </header>
    <div>
      <span class="pergyl-badge" data-tone="accent">active</span>
    </div>
    <p>Use cards for grouped content, settings sections, and compact panels.</p>
    <button class="pergyl-button" type="button">Secondary Button</button>
    <button class="pergyl-button" data-variant="primary" type="button">Primary Button</button>
  </article>

  <form class="pergyl-stack" action="#" method="post">
    <div class="pergyl-field">
      <label class="pergyl-label" for="name">Name</label>
      <input class="pergyl-input" id="name" name="name" type="text" placeholder="your-name" />
    </div>

    <div class="pergyl-field">
      <label class="pergyl-label" for="role">Role</label>
      <select class="pergyl-select" id="role" name="role">
        <option>Operator</option>
        <option>Analyst</option>
      </select>
    </div>

    <div class="pergyl-field">
      <label class="pergyl-label" for="notes">Notes</label>
      <textarea class="pergyl-textarea" id="notes" name="notes" placeholder="status update"></textarea>
    </div>

    <label class="pergyl-choice" for="notify">
      <input class="pergyl-checkbox" id="notify" name="notify" type="checkbox" />
      Send notifications
    </label>

    <fieldset class="pergyl-field">
      <legend class="pergyl-label">Mode</legend>
      <label class="pergyl-choice" for="mode-monitor">
        <input class="pergyl-radio" id="mode-monitor" name="mode" type="radio" value="monitor" checked />
        Monitor
      </label>
      <label class="pergyl-choice" for="mode-guard">
        <input class="pergyl-radio" id="mode-guard" name="mode" type="radio" value="guard" />
        Guard
      </label>
    </fieldset>
  </form>

  <aside class="pergyl-alert" data-tone="warn" role="status">
    Disk usage crossed the configured warning threshold.
  </aside>
</section>
