<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 96" width="600" height="96">
  <defs>
    <style>
      .border { fill: none; stroke: #444444; stroke-width: 2; }
      .label { fill: #a3a3a3; }
      .brand { fill: #c47a5a; }
      .tagline { fill: #a3a3a3; }
      .status-ok { fill: #6abe5a; }
      @media (prefers-color-scheme: light) {
        .border { stroke: #bdd4d8; }
        .label { fill: #536b70; }
        .tagline { fill: #536b70; }
        .status-ok { fill: #2e8540; }
      }
    </style>
    <mask id="border-cutouts">
      <rect width="100%" height="100%" fill="white"/>
      <rect x="42" y="6" width="186" height="14" fill="black"/>
    </mask>
  </defs>

  <rect x="21" y="13" width="558" height="76" rx="3" class="border" mask="url(#border-cutouts)"/>

  <circle cx="48" cy="13" r="2.5" class="status-ok"/>
  <text x="58" y="17"
    font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'JetBrains Mono', 'IBM Plex Mono', monospace"
    font-size="10"
    letter-spacing="1.2"
    class="label"
  >COMPONENT-SYSTEM &#183; V0.1</text>

  <text x="34" y="50"
    font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'JetBrains Mono', 'IBM Plex Mono', monospace"
    font-size="30"
    font-weight="600"
    letter-spacing="1"
    class="brand"
  >pergyl<tspan>.</tspan></text>

  <text x="34" y="74"
    font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'JetBrains Mono', 'IBM Plex Mono', monospace"
    font-size="12"
    class="tagline"
  >HTML-first web UI primitives with a clean terminal feel.</text>
</svg>
