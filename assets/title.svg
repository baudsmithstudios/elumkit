<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 96" width="600" height="96"
     font-family="'JetBrains Mono','IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace">
  <!-- Iron-theme palette mirrors packages/core-css/src/tokens.css. -->
  <!-- Resync if Pergyl iron tokens change. -->

  <!-- Card surface and 2px border (radius 3px = --pergyl-radius-md). -->
  <rect x="20" y="20" width="560" height="60" rx="3" fill="#1c1c1c" />
  <rect x="21" y="21" width="558" height="58" rx="3" fill="none" stroke="#444444" stroke-width="2" />

  <!-- Card label inset across the top border. -->
  <rect x="40" y="14" width="220" height="14" fill="#121212" />
  <text x="50" y="25" font-size="11" letter-spacing="2" fill="#a3a3a3">COMPONENT-SYSTEM · V0.1</text>

  <!-- Brand mark, centered vertically inside the card body. -->
  <text x="40" y="60" font-size="26" font-weight="600" letter-spacing="1.5" fill="#eeeeee">pergyl<tspan fill="#c47a5a">.</tspan></text>
</svg>
