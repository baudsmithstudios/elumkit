<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .label { fill: #a3a3a3; font-size: 17px; letter-spacing: 6px; }
      .copy { fill: #eeeeee; font-size: 18px; letter-spacing: 1px; }
      .muted { fill: #a3a3a3; }
      .rust { fill: #c47a5a; }
      .success { fill: #6ac760; }
      .warn { fill: #e5ad37; }
      .idle { fill: #c8c8c8; }
      .panel { fill: #1c1c1c; }
      .frame { fill: none; stroke: #444444; stroke-width: 3; }
    </style>
  </defs>

  <rect width="1280" height="640" fill="#121212"/>

  <rect x="40" y="24" width="1200" height="260" rx="3" class="panel"/>
  <rect x="41.5" y="25.5" width="1197" height="257" rx="3" class="frame"/>
  <circle cx="104" cy="82" r="6" class="success"/>
  <text x="126" y="89" class="mono label">COMPONENT-SYSTEM · V0.1</text>
  <text x="1120" y="89" class="mono label rust">READY</text>
  <text x="102" y="176" class="mono" font-size="74" font-weight="600" letter-spacing="14" fill="#eeeeee">pergyl<tspan class="rust">.</tspan></text>
  <text x="102" y="232" class="mono muted" font-size="26" letter-spacing="1">HTML-first web UI primitives with a clean terminal feel.</text>

  <rect x="40" y="316" width="384" height="178" rx="3" class="panel"/>
  <rect x="41.5" y="317.5" width="381" height="175" rx="3" class="frame"/>
  <text x="64" y="356" class="mono label">STATUS</text>
  <circle cx="70" cy="389" r="5" class="success"/>
  <text x="96" y="395" class="mono copy success">build · ok</text>
  <circle cx="70" cy="425" r="5" class="warn"/>
  <text x="96" y="431" class="mono copy warn">a11y · review</text>
  <circle cx="70" cy="461" r="5" class="idle"/>
  <text x="96" y="467" class="mono copy idle">docs · idle</text>

  <rect x="448" y="316" width="384" height="178" rx="3" class="panel"/>
  <rect x="449.5" y="317.5" width="381" height="175" rx="3" class="frame"/>
  <text x="472" y="356" class="mono label">COVERAGE</text>
  <text x="810" y="356" text-anchor="end" class="mono rust" font-size="17" letter-spacing="2">82%</text>
  <rect x="472" y="378" width="334" height="8" rx="1" fill="#121212" stroke="#666666" stroke-width="1"/>
  <rect x="472" y="378" width="274" height="8" rx="1" fill="#c47a5a"/>
  <text x="472" y="421" class="mono label">TOKENS</text>
  <text x="810" y="421" text-anchor="end" class="mono rust" font-size="17" letter-spacing="2">14</text>
  <rect x="472" y="443" width="334" height="8" rx="1" fill="#121212" stroke="#666666" stroke-width="1"/>
  <rect x="472" y="443" width="184" height="8" rx="1" fill="#c47a5a"/>

  <rect x="856" y="316" width="384" height="178" rx="3" class="panel"/>
  <rect x="857.5" y="317.5" width="381" height="175" rx="3" class="frame"/>
  <text x="880" y="356" class="mono label">CONTROLS</text>
  <rect x="880" y="380" width="76" height="34" rx="0" fill="#121212" stroke="#c47a5a" stroke-width="1"/>
  <text x="916" y="403" text-anchor="middle" class="mono rust" font-size="18" letter-spacing="2">RUN</text>
  <rect x="880" y="426" width="336" height="40" rx="0" fill="#1c1c1c" stroke="#444444" stroke-width="1"/>
  <text x="892" y="453" class="mono muted" font-size="18">&gt; input_</text>
</svg>
